<style>
  /* =========================================================
     CHRISTMAS FILM LISTINGS
     All custom classes are namespaced to avoid conflicts
  ========================================================= */
  .christmas-ticket-info {
    width: calc(100% - 80px);
    max-width: 900px;
    margin: 18px auto 0;

    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }

  .christmas-ticket-info__item {
    text-align: center;
  }

  .christmas-ticket-info__item b,
  .christmas-ticket-info__item span {
    display: block;
  }

  .christmas-ticket-info__item span {
    margin-top: 6px;
  }

  @media (max-width: 900px) {
    .christmas-ticket-info {
      width: calc(100% - 30px);
      grid-template-columns: 1fr;
      gap: 16px;
    }
  }
  .christmas-film-grid {
    width: calc(100% - 80px);
    max-width: 1260px;
    margin: 28px auto 0;

    display: grid;

    /*
   * Two columns when there is enough ACTUAL space.
   * Automatically switches to one column when cards
   * would otherwise become too narrow.
   */
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr));

    gap: 28px;
    align-items: stretch;
  }

  .christmas-film-card {
    background: #fcf9f0;
    border: 1px solid #ded5c2;
    box-sizing: border-box;
    padding: 30px;

    /*
   * Grid now controls the card width,
   * so remove the old 50% flex sizing.
   */
    width: 100%;
    max-width: none;
  }

  .christmas-film-card__inner {
    display: flex;
    gap: 26px;
    height: 100%;
    align-items: stretch;
  }

  .christmas-film-card__poster {
    flex: 0 0 265px;
    max-width: 265px;
    width: 265px;
  }

  .christmas-film-card__poster img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .christmas-film-card__content {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 100%;
    min-width: 0;
  }

  .christmas-film-card__title {
    margin: 0;
  }

  .christmas-film-card__date {
    margin: 6px 0 0;
  }

  .christmas-film-card__meta,
  .christmas-film-card__desc {
    margin: 0;
  }

  .christmas-film-card__meta {
    margin-top: 6px;
  }

  .christmas-film-card__desc {
    margin-top: 18px;
  }

  /* =========================================================
     DATE SELECT
  ========================================================= */

  .christmas-film-card__date-wrapper {
    margin-top: 18px;
  }

  .christmas-film-card__date-label {
    display: block;
    margin-bottom: 8px;
  }

  .christmas-film-card__select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 40px 12px 14px;

    border: 1px solid #ded5c2;
    background-color: #fff;
    color: #000;

    font: inherit;
    cursor: pointer;
  }

  /* =========================================================
     BOOKING BUTTON
  ========================================================= */

  .christmas-film-card__action {
    margin-top: auto;
    padding-top: 30px;
  }

  .christmas-film-card__action > a {
    display: inline-block;
    min-width: 190px;
    text-align: center;
  }

  /* Hidden on desktop */
  .christmas-film-card__toggle {
    display: none;
  }

  /* =========================================================
     MOBILE
  ========================================================= */

  @media (max-width: 900px) {
    .christmas-film-grid {
      width: calc(100% - 30px);
      margin: 16px auto 0;
      gap: 16px;
    }

    .christmas-film-card {
      padding: 24px;
      width: 100%;
      max-width: none;
    }

    .christmas-film-card__poster {
      display: none;
    }

    .christmas-film-card__inner {
      display: block;
      height: auto;
    }

    .christmas-film-card__content {
      min-height: 0;
    }

    .christmas-film-card__meta {
      margin-top: 4px;
    }

    /* =======================================================
       MOBILE DESCRIPTION DROPDOWN
    ======================================================= */

    .christmas-film-card__toggle {
      display: block;

      margin-top: 18px;
      padding: 0;

      border: 0;
      background: none;

      cursor: pointer;
    }

    .christmas-film-card__toggle::after {
      content: " +";
    }

    .christmas-film-card__toggle[aria-expanded="true"]::after {
      content: " −";
    }

    .christmas-film-card__desc {
      display: none;
      margin-top: 16px;
    }

    }

    /* =======================================================
       MOBILE BOOKING BUTTON
    ======================================================= */

    .christmas-film-card__action {
      margin-top: 24px;
      padding-top: 0;
    }

    .christmas-film-card__action > a {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }
  }
</style>

    /*
     * =========================================================
     * BOOKING URL GENERATOR
     * =========================================================
     *
     * Always produces:
     *
     * /book-movie-name-DDMMYY
     */

    function christmasCreateMovieSlug(title) {
      return title
        .toLowerCase()
        .replace(/['’]/g, "")
        .replace(/&/g, "and")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function christmasCreateDateSlug(dateString) {
      const parts = dateString.split("-");

      const year = parts[0].slice(-2);
      const month = parts[1];
      const day = parts[2];

      return day + month + year;
    }

    function christmasCreateBookingURL(movieTitle, dateString) {
      return (
        "/book-" +
        christmasCreateMovieSlug(movieTitle) +
        "-" +
        christmasCreateDateSlug(dateString)
      );
    }

    /*
     * =========================================================
     * DATE FORMATTING
     * =========================================================
     */

    function christmasGetOrdinal(day) {
      if (day > 3 && day < 21) {
        return day + "th";
      }

      switch (day % 10) {
        case 1:
          return day + "st";

        case 2:
          return day + "nd";

        case 3:
          return day + "rd";

        default:
          return day + "th";
      }
    }

    function christmasFormatDate(dateString) {
      const parts = dateString.split("-");

      const year = Number(parts[0]);
      const month = Number(parts[1]);
      const day = Number(parts[2]);

      const date = new Date(year, month - 1, day);

      const weekday = date.toLocaleDateString("en-GB", {
        weekday: "long",
      });

      const monthName = date.toLocaleDateString("en-GB", {
        month: "long",
      });

      return weekday + ", " + christmasGetOrdinal(day) + " " + monthName;
    }

      /* =====================================================
   DATE / AVAILABILITY LINE
===================================================== */

      /*
       * Single screening:
       * show the actual screening date.
       *
       * Multiple screenings:
       * show "Various dates available".
       */

      if (film.dates.length === 1) {
        dateLine.textContent = christmasFormatDate(film.dates[0]);
      } else {

      }

      content.appendChild(dateLine);

      /* META */

      const meta = document.createElement("p");

      meta.className = "christmas-film-card__meta FW600 gold";

      meta.innerHTML = film.meta;

      content.appendChild(meta);

      /*
       * DESCRIPTION
       */

      description.textContent = film.description;

      content.appendChild(description);

      /*
       * =====================================================
       * DATE SELECTOR
       * =====================================================
       */

      const dateWrapper = document.createElement("div");

      dateWrapper.className = "christmas-film-card__date-wrapper";

      const label = document.createElement("label");

      label.className = "christmas-film-card__date-label FW600 black";

      const selectId = "christmas-film-date-" + filmIndex;

      label.setAttribute("for", selectId);

      label.textContent =
        film.dates.length > 1 ? "Choose a date" : "Screening date";

      const select = document.createElement("select");

      select.className = "christmas-film-card__select";

      select.id = selectId;

      /*
       * Multiple dates:
       * add "Select a date" placeholder.
       */

      if (film.dates.length > 1) {
        const placeholder = document.createElement("option");

        placeholder.value = "";

        placeholder.textContent = "Select a date";

        placeholder.disabled = true;
        placeholder.selected = true;

        select.appendChild(placeholder);
      }

      /*
       * Add each screening date.
       */

      film.dates.forEach(function (date) {

        option.value = christmasCreateBookingURL(film.title, date);

        option.textContent = christmasFormatDate(date);

        select.appendChild(option);
      });

      dateWrapper.appendChild(label);

      dateWrapper.appendChild(select);

      content.appendChild(dateWrapper);

      /*
       * =====================================================
       * BOOK NOW BUTTON
       * =====================================================
       */

      const action = document.createElement("div");

      action.className =
        "christmas-film-card__action btn-wrapper btn-align-right";

      const button = document.createElement("a");

      button.className =
        "christmas-film-card__button center btn btn-primary-gold-dark btn-hover-sweep ext-link";

      if (film.dates.length === 1) {
        button.href = christmasCreateBookingURL(film.title, film.dates[0]);
      } else {
        button.href = "#";
      }

      const buttonText = document.createElement("span");

      buttonText.textContent = "Book now";

      button.appendChild(buttonText);

      action.appendChild(button);

      content.appendChild(action);

      /*
       * =====================================================
       * CHANGE BOOKING URL WHEN DATE IS SELECTED
       * =====================================================
       */

      select.addEventListener("change", function () {
        button.href = this.value;
      });

      button.addEventListener("click", function (event) {
        if (film.dates.length > 1 && !select.value) {
          event.preventDefault();

          select.focus();
        }
      });

      /*
       * =====================================================
       * FINISH CARD
       * =====================================================
       */

      inner.appendChild(content);

      card.appendChild(inner);

      christmasGrid.appendChild(card);
    });

    christmasGrid
      .querySelectorAll(".christmas-film-card__content")
      .forEach(function (card) {
        const description = card.querySelector(".christmas-film-card__desc");

        if (!description) {
          return;
        }

        const toggle = document.createElement("button");

        toggle.type = "button";

        toggle.className = "christmas-film-card__toggle";

        toggle.textContent = "View description";

        toggle.setAttribute("aria-expanded", "false");

        description.before(toggle);

        toggle.addEventListener("click", function () {
          const isOpen = description.classList.toggle("is-open");

          toggle.setAttribute("aria-expanded", isOpen);

          toggle.textContent = isOpen ? "Hide description" : "View description";
        });
      });
  })();
</script>
